<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Breakthrough Sabbatical</title>
  <!--
    The loop, broken open. Work, habits, the week that feeds itself — and the
    gap where you stepped out of it. Geometry source of truth:
    W:/systems/products/breakthroughsabbatical/brand/logo/

    Keeps the previous icon's terracotta ring and gold centre, but the ring is
    now open and the gold has moved outside it: the point is the leaving, not
    the circling.

    Favicon build: stroke 24 rather than 16, gold square 36 rather than 28.
    At 16 px the display weights collapse and the gold becomes one pixel.
    Above ~64 px use breakthrough-sabbatical-mark.svg.
  -->
  <rect width="200" height="200" rx="44" fill="#1c1917"/>
  <g fill="none" stroke="#b4541e" stroke-width="24" stroke-linecap="butt">
    <path d="M 147.6 111.9 A 52 52 0 1 0 111.9 147.6" />
  </g>
  <rect x="139" y="139" width="36" height="36" fill="#b88a1b" />
</svg>
